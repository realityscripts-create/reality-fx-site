<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84">
  <defs>
    <linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E7AE"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9C7B26"/>
    </linearGradient>
    <filter id="crownGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- the crown — the mark of the Academy's founder, raised above the wordmark -->
  <g transform="translate(15,4) scale(2.35)" filter="url(#crownGlow)">
    <path d="M4 16.5 L3 7 L9 11 L12 5 L15 11 L21 7 L20 16.5 Z" fill="url(#goldg)"/>
    <rect x="2" y="16.5" width="20" height="2" rx="1" fill="url(#goldg)"/>
  </g>
  <text x="84" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="0.6">Reality FX</text>
