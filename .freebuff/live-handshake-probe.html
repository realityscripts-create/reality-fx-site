<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Handshake Probe — reality-fx-os</title>
<style>
  body { background:#0b0e14; color:#e8e2d0; font-family:Georgia,serif; padding:40px; }
  .card { background:#141925; border:1px solid #a8842a55; border-radius:14px; padding:28px; max-width:560px; margin:0 auto; }
  h1 { color:#d4af37; font-size:22px; margin-top:0; letter-spacing:1px; }
  .ok { color:#7ddfa0; font-weight:bold; }
  .bad { color:#ff8a8a; font-weight:bold; }
  .row { margin:10px 0; }
  .lbl { color:#9a8f7a; font-size:12px; text-transform:uppercase; letter-spacing:2px; }
  .val { font-size:17px; margin-top:3px; }
  .badge { display:inline-block; background:#a8842a; color:#0b0e14; padding:3px 12px; border-radius:20px; font-size:12px; font-weight:bold; letter-spacing:1px; margin-left:8px; }
  #status { font-family:monospace; font-size:13px; color:#9a8f7a; margin-top:18px; }
</style>
</head>
<body>
<div class="card">
  <h1>👑 LIVE HANDSHAKE PROBE</h1>
  <p style="color:#9a8f7a;font-size:13px;">Fetches <b>reality-fx-os.netlify.app/api/handoffs</b> — exactly what the OS greets you with.</p>
  <div id="out"><span class="bad">Checking…</span></div>
  <div id="status"></div>
</div>
<script>
  const out = document.getElementById('out');
  const status = document.getElementById('status');
  fetch('https://reality-fx-os.netlify.app/api/handoffs', { cache: 'no-store' })
    .then(function (r) { status.textContent = 'HTTP ' + r.status + ' · ' + r.headers.get('content-type'); return r.json(); })
    .then(function (list) {
      const rec = (list || []).find(function (h) { return h.studentId === 'RFX-10482'; });
      if (!rec) { out.innerHTML = '<span class="bad">No founder handoff found on the live rail.</span>'; return; }
      out.innerHTML =
        '<div class="row"><div class="lbl">Verified name</div><div class="val">' + rec.verifiedName +
        (rec.founder ? '<span class="badge">FOUNDER</span>' : '') + '</div></div>' +
        '<div class="row"><div class="lbl">Student ID</div><div class="val">' + rec.studentId + '</div></div>' +
        '<div class="row"><div class="lbl">Student code</div><div class="val">' + (rec.studentCode || '—') + '</div></div>' +
        '<div class="row"><div class="lbl">Email</div><div class="val">' + rec.email + '</div></div>' +
        '<div class="row"><div class="lbl">Trust standing</div><div class="val">' + ((rec.trust && rec.trust.tier) || 'standard') + ' (' + ((rec.trust && rec.trust.score) || '—') + ')</div></div>' +
        '<div class="row"><div class="lbl">Greeted since</div><div class="val">' + rec.receivedAt + '</div></div>' +
        '<p class="ok">✔ The live rail answered — the OS will greet this identity on load.</p>';
    })
    .catch(function (e) { out.innerHTML = '<span class="bad">Failed: ' + e.message + '</span>'; });
</script>
</body>
</html>
